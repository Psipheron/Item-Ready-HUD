name: Release JAR with Gradle

on:
  push:
    tags:
      - 'v*' # Triggers whenever a tag starting with 'v' is pushed (e.g., v1.0.0)

permissions:
  contents: write # Required to create a GitHub Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Java JDK environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # 3. Configure Gradle cache
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Build the project and generate the JAR file
    - name: Build with Gradle
      run: ./gradlew build

    # 5. Create GitHub Release and attach the built JAR
    - name: Release and Upload JAR
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: "Automated release built via GitHub Actions."
        artifacts: "build/libs/*.jar"
        token: ${{ secrets.GITHUB_TOKEN }}
